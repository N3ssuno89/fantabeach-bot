name: Tabelloni

on:
  schedule:
    - cron: '12,22,32,42,52 * * * *'
  workflow_dispatch:
    inputs:
      tornei:
        description: 'vis_id separati da virgola (vuoto = tornei in corso)'
        required: false
      prova:
        description: 'true = genera negli artifact senza inviare'
        required: false
        default: 'false'
      forza:
        description: 'true = invia su Telegram i dati del momento, anche fuori dagli stati'
        required: false
        default: 'false'
      replay:
        description: 'true = ricostruisce e invia tutti gli stati in sequenza (torneo concluso)'
        required: false
        default: 'false'

concurrency:
  group: tabelloni
  cancel-in-progress: true

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pillow requests numpy
      - name: Genera e invia tabelloni
        env:
          SUPABASE_URL:   ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY:   ${{ secrets.SUPABASE_ANON_KEY }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT:  ${{ secrets.TELEGRAM_CHAT_ID }}
          CICLI: ${{ github.event_name == 'schedule' && '11' || '1' }}
          PAUSA_CICLO: '300'
          TORNEI: ${{ github.event.inputs.tornei }}
          PROVA:  ${{ github.event.inputs.prova }}
          FORZA:  ${{ github.event.inputs.forza }}
          REPLAY: ${{ github.event.inputs.replay }}
        run: python tabelloni.py
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: tabelloni
          path: out/
          if-no-files-found: ignore
          retention-days: 7
