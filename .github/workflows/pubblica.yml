name: Pubblica risultati

on:
  schedule:
        - cron: '2,7,12,17,22,27,32,37,42,47,52,57 * * * *'

  workflow_dispatch:
    inputs:
      tornei:
        description: 'vis_id separati da virgola (vuoto = tornei in corso)'
        required: false
      prova:
        description: 'true = genera senza inviare su Telegram'
        required: false
        default: 'false'
      limite:
        description: 'quante inviarne al massimo (vuoto = normale)'
        required: false

concurrency:
  group: pubblica
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pillow requests numpy
      - name: Controlla template
        run: python verifica.py
      - name: Genera e invia
        env:
          SUPABASE_URL:   ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY:   ${{ secrets.SUPABASE_ANON_KEY }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT:  ${{ secrets.TELEGRAM_CHAT_ID }}
          TORNEI: ${{ github.event.inputs.tornei }}
          PROVA:  ${{ github.event.inputs.prova }}
          LIMITE: ${{ github.event.inputs.limite }}
        run: python bot.py
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: immagini
          path: out/
          if-no-files-found: ignore
          retention-days: 7
